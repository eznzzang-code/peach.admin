<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행사 상세 | 복숭아자조금 관리자</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
<script>location.replace("contents-list.html");</script>
<link rel="stylesheet" href="css/flow-alignment.css">
</head>
<body hidden data-page="events">
  <div class="layout">
    <header class="header">
      <a class="header__brand" href="contents-list.html">
        <img class="header__logo" src="assets/logo.svg" alt="">
        복숭아자조금 관리자
      </a>
      <div class="header__tools">
        <a class="header__site" href="../../../../peach-web/index.html" target="_blank" rel="noopener noreferrer">
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.8 7.1 8 2.9l5.2 4.2V13.2H9.4V9.2H6.6v4H2.8V7.1Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path>
          </svg>
          홈페이지
        </a>
        <span class="header__user">
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="5.2" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle>
            <path d="M3.2 13.2c.8-2.2 2.5-3.2 4.8-3.2s4 1 4.8 3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
          </svg>
          <span data-user-name>정유현</span>
        </span>
        <button type="button" class="header__logout" data-logout>
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6.2 3.2H3.4v9.6h2.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M7.2 8h6M10.8 5.4 13.4 8l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          로그아웃
        </button>
      </div>
    </header>

    <div class="layout__body">
      <nav class="sidebar" aria-label="주요 메뉴">
        <a class="sidebar__link" href="index.html" data-menu="home">
          <span class="sidebar__dot" aria-hidden="true"></span>
          홈
        </a>
        <div class="sidebar__group" data-menu-group="contents">
          <button type="button" class="sidebar__toggle" aria-expanded="false" aria-controls="sidebar-posts">
            <span class="sidebar__dot" aria-hidden="true"></span>
            게시글 관리
            <svg class="sidebar__chevron" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div class="sidebar__sub" id="sidebar-posts" hidden>
            <a class="sidebar__sublink" href="contents-list.html#notice" data-menu="contents-notice" data-menu-hash="notice">공지사항</a>
            <a class="sidebar__sublink" href="contents-list.html#info" data-menu="contents-info" data-menu-hash="info">복숭아정보</a>
            <a class="sidebar__sublink" href="contents-list.html#material" data-menu="contents-material" data-menu-hash="material">재배자료</a>
          </div>
        </div>
        <div class="sidebar__group" data-menu-group="content-hub">
          <button type="button" class="sidebar__toggle" aria-expanded="false" aria-controls="sidebar-content-hub">
            <span class="sidebar__dot" aria-hidden="true"></span>
            재배·과원관리
            <svg class="sidebar__chevron" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div class="sidebar__sub" id="sidebar-content-hub" hidden>
            <a class="sidebar__sublink" href="orchard-content.html" data-menu="orchard-content">월별 과원관리</a>
            <a class="sidebar__sublink" href="cultivation-content.html" data-menu="cultivation-content">상시 재배력</a>
          </div>
        </div>
        <a class="sidebar__link" href="videos-list.html" data-menu="videos">
          <span class="sidebar__dot" aria-hidden="true"></span>
          교육영상 관리
        </a>
        <a class="sidebar__link" href="permissions.html" data-menu="permissions">
          <span class="sidebar__dot" aria-hidden="true"></span>
          운영자·권한 관리
        </a>
      </nav>

      <main class="main events-page events-detail">
        <h1 class="page-title">
          <span class="page-title__sep">&gt;</span>
          상세
        </h1>

        <div class="contents-missing" id="event-detail-missing" hidden>
          <p>행사를 찾을 수 없습니다.</p>
        </div>

        <div id="event-detail" class="form" hidden>
          <p class="events-edit-limit" id="event-detail-alerts" hidden></p>
          <div class="form-row">
            <span class="form-row__label">행사명</span>
            <div class="form-row__controls">
              <input class="input input--block" id="event-detail-title" type="text" readonly>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">모집 상태</span>
            <div class="form-row__controls">
              <span id="event-detail-status">-</span>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">행사일시</span>
            <div class="form-row__controls">
              <input class="input input--date" id="event-detail-start-date" type="text" readonly aria-label="행사 시작일">
              <input class="input input--time" id="event-detail-start-time" type="text" readonly aria-label="행사 시작시간">
              <span class="range__sep">~</span>
              <span class="events-create__inline-label">종료일시</span>
              <input class="input input--date" id="event-detail-end-date" type="text" readonly aria-label="행사 종료일">
              <input class="input input--time" id="event-detail-end-time" type="text" readonly aria-label="행사 종료시간">
              <label class="checkbox">
                <input type="checkbox" id="event-detail-no-end" disabled>
                <span class="checkbox__box" aria-hidden="true"></span>
                <span class="checkbox__text">종료일 없음</span>
              </label>
            </div>
          </div>

          <div class="form-row form-row--top">
            <span class="form-row__label">소개</span>
            <div class="form-row__controls">
              <textarea class="input input--block" id="event-detail-intro" rows="3" readonly></textarea>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">장소</span>
            <div class="form-row__controls">
              <input class="input input--block" id="event-detail-place" type="text" readonly>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">모집기간</span>
            <div class="form-row__controls">
              <input class="input input--date" id="event-detail-recruit-start-date" type="text" readonly aria-label="모집 시작일">
              <input class="input input--time" id="event-detail-recruit-start-time" type="text" readonly aria-label="모집 시작시간">
              <span class="range__sep">~</span>
              <input class="input input--date" id="event-detail-recruit-end-date" type="text" readonly aria-label="모집 마감일">
              <input class="input input--time" id="event-detail-recruit-end-time" type="text" readonly aria-label="모집 마감시간">
              <label class="checkbox">
                <input type="checkbox" id="event-detail-recruit-no-end" disabled>
                <span class="checkbox__box" aria-hidden="true"></span>
                <span class="checkbox__text">종료일 없음</span>
              </label>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">모집인원</span>
            <div class="form-row__controls">
              <input class="input events-capacity" id="event-detail-capacity" type="text" readonly aria-label="모집인원">
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">확정 신청 인원</span>
            <div class="form-row__controls">
              <span id="event-detail-confirmed">-</span>
            </div>
          </div>

          <div class="form-row">
            <span class="form-row__label">참가 대상조건</span>
            <div class="form-row__controls">
              <input class="input events-target" id="event-detail-audience" type="text" readonly aria-label="참가 대상조건">
            </div>
          </div>

          <div class="form-row form-row--top">
            <span class="form-row__label">추가질문</span>
            <div class="form-row__controls" id="event-detail-questions">미등록</div>
          </div>

          <div class="form-row form-row--top">
            <span class="form-row__label">첨부파일</span>
            <div class="form-row__controls" id="event-detail-files">미등록</div>
          </div>

          <div class="events-actions">
            <div class="events-actions__group">
              <button type="button" class="btn btn--danger" id="event-detail-cancel">기관취소</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal" id="modal-event-cancel" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="event-cancel-title">
      <div class="modal__header">
        <h2 class="modal__title" id="event-cancel-title">기관취소</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">×</button>
      </div>
      <div class="modal__body">
        <p id="event-cancel-name"></p>
        <p class="events-cancel__note">기관이 취소하면 신규 신청을 받을 수 없습니다. 기존 신청 내역은 삭제되지 않습니다.</p>
        <label class="events-cancel__label" for="event-cancel-reason">취소 사유<span class="required">*</span></label>
        <textarea class="input input--block" id="event-cancel-reason" rows="3"></textarea>
        <p class="field-error" id="event-cancel-reason-error" hidden>취소 사유를 입력해 주세요.</p>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn" data-modal-close>돌아가기</button>
        <button type="button" class="btn btn--danger" id="event-cancel-confirm">취소</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-event-detail-notice" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="event-detail-notice-title">
      <div class="modal__header">
        <h2 class="modal__title" id="event-detail-notice-title">안내</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">×</button>
      </div>
      <div class="modal__body">
        <p id="event-detail-notice"></p>
      </div>
      <div class="modal__footer modal__footer--center">
        <button type="button" class="btn" data-modal-close>확인</button>
      </div>
    </div>
  </div>

  
  
  
  
  <!-- 추후 반영 예정 안내: 이 script를 제거하면 기존 화면 복구 -->
  
<noscript><p>현재 제공하지 않는 메뉴입니다.</p><a href="contents-list.html">게시물 관리로 이동</a></noscript></body>
</html>
