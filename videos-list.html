<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영상 관리 | 복숭아자조금 관리자</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/flow-alignment.css">
</head>
<body data-page="videos">
  <div class="layout">
    <header class="header">
      <a class="header__brand" href="contents-list.html">
        <img class="header__logo" src="assets/logo.svg" alt="">
        복숭아자조금 관리자
      </a>
      <div class="header__tools">
        <a class="header__site" href="../../../../peach-web/index.html" target="_blank" rel="noopener noreferrer">
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2.8 7.1 8 2.9l5.2 4.2V13.2H9.4V9.2H6.6v4H2.8V7.1Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"></path>
          </svg>
          홈페이지
        </a>
        <span class="header__user">
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="5.2" r="2.2" fill="none" stroke="currentColor" stroke-width="1.2"></circle>
            <path d="M3.2 13.2c.8-2.2 2.5-3.2 4.8-3.2s4 1 4.8 3.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
          </svg>
          <span data-user-name>정유현</span>
        </span>
        <button type="button" class="header__logout" data-logout>
          <svg class="header__icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M6.2 3.2H3.4v9.6h2.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M7.2 8h6M10.8 5.4 13.4 8l-2.6 2.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          로그아웃
        </button>
      </div>
    </header>

    <div class="layout__body">
      <nav class="sidebar" aria-label="주요 메뉴">
        <a class="sidebar__link" href="index.html" data-menu="home">
          <span class="sidebar__dot" aria-hidden="true"></span>
          홈
        </a>
        <div class="sidebar__group" data-menu-group="contents">
          <button type="button" class="sidebar__toggle" aria-expanded="false" aria-controls="sidebar-posts">
            <span class="sidebar__dot" aria-hidden="true"></span>
            게시글 관리
            <svg class="sidebar__chevron" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div class="sidebar__sub" id="sidebar-posts" hidden>
            <a class="sidebar__sublink" href="contents-list.html#notice" data-menu="contents-notice" data-menu-hash="notice">공지사항</a>
            <a class="sidebar__sublink" href="contents-list.html#info" data-menu="contents-info" data-menu-hash="info">복숭아정보</a>
            <a class="sidebar__sublink" href="contents-list.html#material" data-menu="contents-material" data-menu-hash="material">재배자료</a>
          </div>
        </div>
        <div class="sidebar__group" data-menu-group="content-hub">
          <button type="button" class="sidebar__toggle" aria-expanded="false" aria-controls="sidebar-content-hub">
            <span class="sidebar__dot" aria-hidden="true"></span>
            재배·과원관리
            <svg class="sidebar__chevron" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div class="sidebar__sub" id="sidebar-content-hub" hidden>
            <a class="sidebar__sublink" href="orchard-content.html" data-menu="orchard-content">월별 과원관리</a>
            <a class="sidebar__sublink" href="cultivation-content.html" data-menu="cultivation-content">상시 재배력</a>
          </div>
        </div>
        <a class="sidebar__link" href="videos-list.html" data-menu="videos">
          <span class="sidebar__dot" aria-hidden="true"></span>
          교육영상 관리
        </a>
        <a class="sidebar__link" href="permissions.html" data-menu="permissions">
          <span class="sidebar__dot" aria-hidden="true"></span>
          운영자·권한 관리
        </a>
      </nav>

      <main class="main videos-page">
        <h1 class="page-title">영상 관리</h1>

        <div class="list-filters">
          <div class="select" data-select>
            <button type="button" class="select__button" aria-haspopup="listbox" aria-expanded="false">
              <span class="select__label">수집상태</span>
              <svg class="select__chevron" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
              </svg>
            </button>
            <ul class="select__list" role="listbox" hidden>
              <li><button type="button" class="select__option is-selected" data-value="">수집상태</button></li>
              <li><button type="button" class="select__option" data-value="정상">정상</button></li>
              <li><button type="button" class="select__option" data-value="실패">실패</button></li>
              <li><button type="button" class="select__option" data-value="원본 없음">원본 없음</button></li>
            </ul>
            <input type="hidden" name="collectionStatus" value="">
          </div>

          <div class="select" data-select>
            <button type="button" class="select__button" aria-haspopup="listbox" aria-expanded="false">
              <span class="select__label">홈 노출</span>
              <svg class="select__chevron" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
              </svg>
            </button>
            <ul class="select__list" role="listbox" hidden>
              <li><button type="button" class="select__option is-selected" data-value="">홈 노출</button></li>
              <li><button type="button" class="select__option" data-value="노출">노출</button></li>
              <li><button type="button" class="select__option" data-value="미노출">미노출</button></li>
            </ul>
            <input type="hidden" name="mainExposure" value="">
          </div>

          <div class="select" data-select>
            <button type="button" class="select__button" aria-haspopup="listbox" aria-expanded="false">
              <span class="select__label">분류</span>
              <svg class="select__chevron" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
              </svg>
            </button>
            <ul class="select__list" role="listbox" hidden>
              <li><button type="button" class="select__option is-selected" data-value="">분류</button></li>
              <li><button type="button" class="select__option" data-value="재배기술">재배기술</button></li>
              <li><button type="button" class="select__option" data-value="생육단계">생육단계</button></li>
              <li><button type="button" class="select__option" data-value="미분류">미분류</button></li>
            </ul>
            <input type="hidden" name="category" value="">
          </div>

          <input class="input input--search" type="search" name="keyword" placeholder="영상제목" aria-label="영상제목">
          <button type="button" class="btn" id="videos-search">검색</button>

          <div class="videos-collect">
            <!-- TODO: 최근 수집 시각은 수집 API 응답 또는 서버 기록을 기준으로 표시합니다. -->
            <span id="videos-collected-at">최근 수집 26.10.01 09:00</span>
            <span class="videos-collect__status" id="videos-collect-status" role="status" aria-live="polite"></span>
            <button type="button" class="btn videos-refresh" id="videos-refresh">
              <svg class="videos-refresh__icon" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M13.2 8a5.2 5.2 0 1 1-1.5-3.6" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"></path>
                <path d="M13.5 2.6V6H10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
              목록 새로고침
            </button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table videos-table" id="videos-table">
            <colgroup>
              <col class="col-no">
              <col class="col-category">
              <col>
              <col class="col-channel">
              <col class="col-duration">
              <col class="col-status">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">No</th>
                <th scope="col">분류</th>
                <th scope="col">영상 제목</th>
                <th scope="col">채널</th>
                <th scope="col">영상길이</th>
                <th scope="col">수집 상태</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

        <nav class="pagination" data-pagination data-current="1" data-total="5" aria-label="페이지"></nav>
      </main>
    </div>
  </div>

  <div class="modal" id="modal-video-collect" hidden>
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="video-collect-title">
      <div class="modal__header">
        <h2 class="modal__title" id="video-collect-title">안내</h2>
        <button type="button" class="modal__close" data-modal-close aria-label="닫기">×</button>
      </div>
      <div class="modal__body">
        <p id="video-collect-message"></p>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn" data-modal-close>확인</button>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/components.js"></script>
  <script src="js/resource-store.js"></script>
<script src="js/pages/videos.js"></script>
</body>
</html>
